<li class="research-entry publication-entry">
  <h3><a href="{{ paper.url }}">{{ paper.title | escape }}</a></h3>
  <p class="research-entry__authors">{{ paper.authors | escape }}</p>
  <div class="entry-meta">
    <span>{{ paper.venue | escape }}</span>
    {% include resource-links.html paper=paper.url slides=paper.slides_url video=paper.video_url video_label=paper.video_label label=paper.title %}
  </div>
</li>
